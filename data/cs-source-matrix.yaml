# ============ 残余缺口（尽量补过，仍有硬限制） ============
residual_gaps:
  - id: acm-ieee-paywall
    problem: "ACM DL 403 Cloudflare；IEEE Xplore 202 挑战页"
    affected: [ SIGGRAPH, CHI, UIST, POPL, PLDI, OOPSLA, ICSE, FSE, SOSP, ISCA, MICRO, "IEEE S&P", CCS ]
    workaround: [ arxiv-api, lipics, jcgt, openalex, doaj, zenodo ]
    note: "用 DOI 走 Unpaywall/OpenAlex 的开放获取链接，再退到 arXiv/作者主页"
  - id: openreview
    problem: "OpenReview API/PDF 403 挑战，forum 页是 JS 壳"
    affected: [ "ICLR/NeurIPS 审稿意见与讨论" ]
    workaround: [ arxiv-api ]
    note: "论文可用 arXiv 版；评审内容基本拿不到"
  - id: dblp
    problem: "DBLP 搜索 API 202 bot challenge；XML dump 体积大、易超时"
    affected: [ "CS 书目检索" ]
    workaround: [ openalex, crossref, semantic-scholar ]
  - id: standards-paywall
    problem: "ISO/IEC、JEDEC、IEEE 754 等正文付费"
    affected: [ "部分标准" ]
    workaround: [ cpp-draft, iso-c-draft, ecma262, posix, unicode, rfc, w3c-tr ]
    note: "有公开草案/等价物就用等价物，没有就标注为缺口"
  - id: bot-protected-sites
    problem: "Runestone 403、ACM Queue 403、lore.kernel.org bot challenge"
    workaround: [ "换开放镜像/官方另源；不要反复重试" ]
  - id: vendor-blogs-blocked
    problem: "OpenAI News 403、Meta AI Blog 400"
    workaround: [ arxiv-api, "公司技术报告页" ]
  - id: unverified
    problem: "本轮网络下未验证/超时"
    items: [ Software-Heritage-API, DBLP-XML-dump, AMD-APM(404), Gortler-Graphics-Book, Foundations-of-Databases ]

# ============ 明确不可用（不放入采集链路） ============
excluded:
  - { name: "ACM Digital Library", status: 403, reason: "Cloudflare 人机验证" }
  - { name: "IEEE Xplore", status: 202, reason: "挑战/风控页" }
  - { name: "Google Scholar", status: 200, reason: "返回验证页（captcha）" }
  - { name: "OpenReview API", status: 403, reason: "ChallengeRequiredError" }
  - { name: "DBLP Search API", status: 202, reason: "bot challenge" }
  - { name: "lore.kernel.org", status: 200, reason: "bot challenge 页面" }
  - { name: "Runestone Academy", status: 403, reason: "Cloudflare" }
  - { name: "ACM Queue", status: 403, reason: "Cloudflare" }
  - { name: "OpenAI News", status: 403, reason: "风控" }
  - { name: "Meta AI Blog", status: 400, reason: "拒绝访问" }
  - { name: "AMD APM", status: 404, reason: "URL 变更/未验证" }

# ============ 采集策略 ============
strategy:
  channel_priority: [ api, rss, atom, git-raw, html, pdf ]
  per_source_record: [ fetched_at, source_url, status, license, version_or_date ]
  rate_limits:
    arxiv: "~3s/request"
    nvd: "5 req / 30s（无 key）"
    github: "60 req/h（无 token）"
    semantic_scholar: "免费层不稳定（实测 429）"
    stackexchange: "约 300 req/day（无 key）"
  large_payloads:
    - { source: rfc-index, size: "13.7MB", action: "一次性落盘" }
    - { source: caniuse-data, size: "4.8MB", action: "落盘/增量" }
    - { source: whatwg-html, size: "15.9MB", action: "按需抓章节" }
    - { source: crates.io, size: "440KB", action: "按包裁剪" }
  failure_policy: "429/403 退到缓存或备用源；不要同一请求反复重试"

# ============ 自我审查（2026-11-06） ============
self_review:
  verdict: "可作为候选源清单；修正 URL 与字段后可作为采集配置 v1。不能直接当『权威判定器』。"
  checks:
    - "结构：119 源 / 17 KA；无重复 id、无悬空引用、YAML 解析通过"
    - "字段：kind/layer/authority/evidence/status/url/ka 完整"
    - "内容：抽查 20 个 200 响应的可见正文，发现 6 个 JS 壳/重定向/框架页"
    - "API：抽查 6 个无参数调用，2 个返回 400（arXiv、StackExchange），已补参数"
