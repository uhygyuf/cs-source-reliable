# CS 知识源矩阵（Agent 可采集版）
# 生成：2026-11-06；实测：本机 Node fetch + 普通浏览器 UA，未使用任何 API key
# 用途：插件/规则的数据层。breadth = 教学层（教材/课程/官方文档/标准）；depth = 前沿层（论文/发布说明/提案/安全公告）
# 注意：status 为当日快照；换网络/时间可能变化。HTML 源需解析，优先 API/RSS。

meta:
  name: "CS 知识源矩阵（Agent 可采集版）"
  version: 1
  generated_at: "2026-11-06"
  scope: "Computer Science，对齐 ACM/IEEE-CS/AAAI CS2023 的 17 个 Knowledge Areas"
  probe_note: "本机 Node fetch，普通浏览器 UA；耗时/状态随环境变化"
  layer_legend:
    breadth: "教学层：稳定知识（教材、课程、官方文档、标准）"
    depth: "前沿层：最新知识（论文、发布说明、提案、公告）"
  authority_legend:
    A: "一手事实：规范正文/官方参考/源码/发布说明"
    B: "权威解释：官方教程/经典教材/同行评审论文"
    C: "可靠二手：社区维护 wiki/开放课程/百科"
    D: "线索：问答/博客/新闻（不可当结论）"
  evidence_legend:
    spec: "标准/规范正文"
    official-doc: "官方文档"
    textbook: "教材"
    course: "课程"
    peer-reviewed: "同行评审论文/会议"
    preprint: "预印本（未审）"
    release-note: "发布说明/changelog"
    advisory: "安全公告/漏洞库"
    blog: "官方博客"
    community: "社区问答/百科"
    index: "索引/目录"
    standard-guide: "知识体系/指南（如 SWEBOK）"
  kind_legend:
    html: "普通 HTML 页面"
    pdf: "PDF 文档"
    api: "JSON/Atom API"
    rss: "RSS feed"
    atom: "Atom feed"
    git-raw: "Git 仓库 raw 文件"
    xml: "XML 文件"
    dataset: "数据文件（JSON/JSONL）"
  content_access_legend:
    static: 静态 HTML，可直接取正文
    portal: 落地页/目录页，需跟随链接到正文
    js: 需要浏览器渲染（纯 fetch 拿不到正文）
    redirect: HTML meta 重定向，需跟随
    frameset: frameset/框架页，正文在子页
    api: JSON/Atom/XML 返回结构化数据
    binary: PDF/二进制，需下载后解析
  verified_at: "2026-11-06（本机快照）"
  rating_basis: "editorial（人工判断，不是实测覆盖率）"
  license_class_legend:
    cc-by-sa: 署名 + 相同方式共享（Wikipedia/MDN/StackExchange 等）
    public-domain: 公有领域（如美国政府作品）
    open-metadata: 元数据开放（如 OpenAlex/Crossref/DOAJ）
    open-access-paper: 论文开放获取，单篇许可可能不同
    varies: 逐条不同，需逐项核对
    site-terms: 站点条款/版权保留，默认只链接 + 短引用
    unknown: 未知，按最严格策略处理
  cache_policy_legend:
    metadata-only: 只存元数据与链接，不缓存正文
    short-quote: 可存短引用并必须署名/链接
    full-text-allowed: 可缓存全文（仍需核对具体许可）
  refresh_legend:
    refresh_days: 建议重验间隔（天）
    last_checked: 最近一次探测日期
    check_method: 探测方法标识
    probe: 最近一次探测的结果快照
  license_note: license_class 是策略分桶，不是法律意见；绑定许可以源站条款为准。

